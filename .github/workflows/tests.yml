name: Ghost QA Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Ghost QA - ${{ matrix.browser }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    services:
      ghost:
        image: ghost:5-alpine

        ports:
          - 3001:2368

        env:
          NODE_ENV: development
          url: http://localhost:3001
          security__staffDeviceVerification: "false"
          mail__transport: Direct

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Generate fresh CI Ghost credentials
        shell: bash
        run: |
          GHOST_EMAIL="qa-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          GHOST_PASSWORD="$(python - <<'PY'
          import secrets
          import string

          alphabet = string.ascii_letters + string.digits + "!@#$%^&*"
          password = (
              "Qa!"
              + "".join(secrets.choice(alphabet) for _ in range(28))
              + "9Z"
          )

          print(password)
          PY
          )"

          echo "GHOST_URL=http://localhost:3001" >> "$GITHUB_ENV"
          echo "GHOST_EMAIL=$GHOST_EMAIL" >> "$GITHUB_ENV"
          echo "GHOST_PASSWORD=$GHOST_PASSWORD" >> "$GITHUB_ENV"

      - name: Check Ghost service
        shell: bash
        run: |
          echo "Checking Ghost container..."
          docker ps -a

          echo "Checking Ghost API..."
          curl --fail --silent --show-error \
            http://localhost:3001/ghost/api/admin/site/ \
            > /dev/null

          echo "Ghost service is reachable."

      - name: Initialize Ghost owner
        run: |
          python scripts/setup_ghost.py

      - name: Run smoke tests
        run: |
          pytest tests/test_smoke.py \
            --browser=${{ matrix.browser }} \
            -v \
            --alluredir=allure-results

      - name: Run login tests
        run: |
          pytest tests/test_login.py \
            --browser=${{ matrix.browser }} \
            -v \
            --alluredir=allure-results

      - name: Run post tests
        run: |
          pytest tests/test_posts.py \
            --browser=${{ matrix.browser }} \
            -v \
            --alluredir=allure-results

      - name: Run BDD publishing tests
        run: |
          pytest tests/test_publishing_bdd.py \
            --browser=${{ matrix.browser }} \
            -v \
            --alluredir=allure-results

      - name: Run accessibility tests
        run: |
          pytest tests/test_accessibility.py \
            --browser=${{ matrix.browser }} \
            -v \
            --alluredir=allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          if-no-files-found: ignore

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.browser }}
          path: |
            test-results/
            screenshots/current/
          if-no-files-found: ignore

      - name: Print Ghost logs
        if: failure()
        shell: bash
        run: |
          echo "===== GHOST CONTAINER LOGS ====="
          docker ps -a
          docker logs $(docker ps -aq --filter ancestor=ghost:5-alpine | head -n 1) || true