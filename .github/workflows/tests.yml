name: Ghost QA Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Tests - ${{ matrix.browser }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    services:
      ghost:
        image: ghost:5-alpine
        ports:
          - 3001:2368
        env:
          NODE_ENV: development
          url: http://localhost:3001
          security__staffDeviceVerification: "false"
          mail__transport: Direct

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser
        run: |
          python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Create fresh Ghost test credentials
        shell: bash
        run: |
          echo "GHOST_URL=http://localhost:3001" >> "$GITHUB_ENV"
          echo "GHOST_EMAIL=qa-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com" >> "$GITHUB_ENV"
          echo "GHOST_PASSWORD=Qa-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-GhostTest!2026" >> "$GITHUB_ENV"

      - name: Initialize Ghost owner account
        run: |
          python scripts/setup_ghost.py

      - name: Run QA tests
        run: |
          pytest \
            tests/test_smoke.py \
            tests/test_login.py \
            tests/test_posts.py \
            tests/test_publishing_bdd.py \
            tests/test_accessibility.py \
            --browser=${{ matrix.browser }} \
            -v \
            --alluredir=allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.browser }}
          path: |
            test-results/
            screenshots/current/