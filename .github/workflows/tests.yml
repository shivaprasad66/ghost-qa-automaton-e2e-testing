name: Ghost QA Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      ghost:
        image: ghost:5-alpine
        ports:
          - 3001:2368
        env:
          NODE_ENV: development
          security__staffDeviceVerification: "false"
          mail__transport: Direct
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:2368/ || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium firefox webkit

      - name: Wait for Ghost
        run: |
          python - <<'PY'
          import time
          import urllib.request

          url = "http://localhost:3001/"

          for _ in range(30):
              try:
                  urllib.request.urlopen(url, timeout=2)
                  print("Ghost is ready")
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("Ghost did not become ready")
          PY

      - name: Run tests
        env:
          GHOST_EMAIL: ${{ secrets.GHOST_EMAIL }}
          GHOST_PASSWORD: ${{ secrets.GHOST_PASSWORD }}
        run: |
          pytest -v \
            --browser=chromium \
            --browser=firefox \
            --browser=webkit

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            allure-results/